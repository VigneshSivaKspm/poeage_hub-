name: POEAGE HUB CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    name: Build & Typecheck Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install

      - name: Typecheck All Packages & Portals
        run: pnpm -r typecheck

      - name: Build All 4 React Apps & Cloud Functions
        run: pnpm -r build

      - name: Security Rules Lint Check
        run: |
          echo "Verifying Firestore & Storage rules files exist and are non-empty..."
          test -s firestore.rules
          test -s storage.rules
          test -s firestore.indexes.json
          echo "Security rules validated successfully."
